<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b2a3d">
  <meta name="robots" content="noindex,nofollow">
  <title>アクセスコード｜木根川レッズ プレイブック</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <p class="eyebrow">KINEGAWA REDS PLAYBOOK</p>
    <h1>アクセスコード</h1>
    <p class="lead">関係者向けページです。閲覧にはアクセスコードが必要です。</p>

    <form id="authForm" novalidate>
      <label for="passcode">アクセスコード</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" inputmode="text" required>
      <button type="submit">ログイン</button>
      <p class="error" id="authError" role="alert" aria-live="polite"></p>
    </form>

    <p class="note">認証状態はこの端末に30日間保存されます。共有端末では閲覧後にログアウトしてください。</p>
  </main>
</body>
</html>
