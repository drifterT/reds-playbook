<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木根川レッズ プレイブック</title>
  <style>
    :root{--bg:#f8f4ea;--ink:#1b2a3d;--muted:#4d6074;--line:#d9d1c1;--card:#fff;--accent:#c43a2e}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7;margin:0;background:var(--bg);color:var(--ink)}
    .wrap{max-width:900px;margin:0 auto;padding:28px 20px 40px}
    h1{font-size:2rem;margin:0 0 8px}
    p{margin:.4rem 0}
    .lead{color:var(--muted);margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{display:block;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
    .card-title{font-weight:700;font-size:1.05rem}
    .card-desc{font-size:.92rem;color:var(--muted)}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>木根川レッズ プレイブック</h1>
    <p class="lead">閲覧したいセクションを選んでください。</p>

    <div class="grid">
      <a class="card" href="policy-mindset.html">
        <div class="card-title">方針・心得</div>
        <div class="card-desc">コーチ心得・選手心得・コーチ配置（運用基準）</div>
      </a>

      <a class="card" href="regular-practice-menu.html">
        <div class="card-title">レギュラー練習メニュー</div>
        <div class="card-desc">練習フローと各カード（2箇所・4箇所・バッティング）</div>
      </a>

      <a class="card" href="Horizontal-balance.html">
        <div class="card-title">Horizontal-balance</div>
        <div class="card-desc">旧 index.html（水平チェック）ページ</div>
      </a>
    </div>
  </main>
</body>
</html>
